name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY:               ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL:                 gemini-2.0-flash
      SUPABASE_URL:                 ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY:            ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_KEY:         ${{ secrets.SUPABASE_SERVICE_KEY }}
      LANGFUSE_PUBLIC_KEY:          ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY:          ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL:            ${{ secrets.LANGFUSE_BASE_URL }}
      GRAFANA_PROMETHEUS_URL:       ${{ secrets.GRAFANA_PROMETHEUS_URL }}
      GRAFANA_PROMETHEUS_USERNAME:  ${{ secrets.GRAFANA_PROMETHEUS_USERNAME }}
      GRAFANA_PROMETHEUS_PASSWORD:  ${{ secrets.GRAFANA_PROMETHEUS_PASSWORD }}
      APP_ENV:                      test
      APP_PORT:                     8000
      APP_NAME:                     legal-aid

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install system dependencies
        run: sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/test_api.py tests/test_rag.py -v